<!DOCTYPE html>
<html>
<body style="font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; padding: 24px; color: #1e293b;">
  <div style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 14px; overflow: hidden; border: 1px solid #e2e8f0;">
    <div style="background: {{ primary_color|default:'#0d6efd' }}; color: #ffffff; padding: 16px 24px; font-weight: 700; font-size: 16px;">
      {{ app_name|default:"App" }}
    </div>
    <div style="padding: 24px;">
      <h2 style="margin: 0 0 12px 0; font-size: 18px;">{{ title }}</h2>
      <p style="margin: 0 0 20px 0; line-height: 1.5;">{{ message }}</p>
      {% if link %}
      <a href="{{ link }}" style="display: inline-block; background: {{ primary_color|default:'#0d6efd' }}; color: #ffffff; text-decoration: none; padding: 10px 18px; border-radius: 999px; font-weight: 600;">
        Öffnen
      </a>
      {% endif %}
    </div>
  </div>
</body>
</html>
